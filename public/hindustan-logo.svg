<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5821f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9800;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e7d32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4caf50;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer gear shape -->
  <circle cx="100" cy="100" r="90" fill="url(#orangeGradient)"/>

  <!-- Gear teeth -->
  <g fill="url(#orangeGradient)">
    <rect x="95" y="5" width="10" height="20" rx="2"/>
    <rect x="95" y="175" width="10" height="20" rx="2"/>
    <rect x="5" y="95" width="20" height="10" rx="2"/>
    <rect x="175" y="95" width="20" height="10" rx="2"/>

    <rect x="155" y="35" width="10" height="20" rx="2" transform="rotate(45 160 45)"/>
    <rect x="35" y="145" width="10" height="20" rx="2" transform="rotate(45 40 155)"/>
    <rect x="35" y="35" width="10" height="20" rx="2" transform="rotate(-45 40 45)"/>
    <rect x="155" y="145" width="10" height="20" rx="2" transform="rotate(-45 160 155)"/>
  </g>

  <!-- Inner green circle -->
  <circle cx="100" cy="100" r="65" fill="url(#greenGradient)"/>

  <!-- India map silhouette (simplified) -->
  <path d="M100 45 L115 55 L120 70 L125 85 L120 100 L130 115 L125 130 L115 140 L100 155 L85 145 L80 130 L75 115 L80 100 L75 85 L80 70 L85 55 Z"
        fill="#ffffff"
        opacity="0.9"/>

  <!-- Center dot -->
  <circle cx="100" cy="100" r="5" fill="#f5821f"/>

  <!-- Text "HITS" around -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a2e">
    Estd 1985
  </text>
</svg>
